[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "remnawave-telegram-vpn-bot"
version = "0.1.0"
description = "Bilingual Telegram VPN subscription bot with safe provider adapters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "cryptography>=43.0,<46.0",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "ruff>=0.6", "mypy>=1.11", "types-python-dateutil>=2.9"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.alembic]
script_location = "alembic"
prepend_sys_path = "."
